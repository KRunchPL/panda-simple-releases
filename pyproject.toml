[project]
name = "panda-simple-releases"
dynamic = ["version"]
description = "Python application to simplify releasing process and changelog management"
authors = [{ name = "KRunchPL", email = "krunchfrompoland@gmail.com" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.15,<4.0"
dependencies = [
    "dulwich==1.2.19",
    "hatch-semver==2.0.2",
    "hatchling==1.32.4",
    "loguru==0.7.3",
    "pydantic==2.14.1",
    "python-dotenv==1.2.4",
    "tomlkit==0.15.2",
    "typer==0.27.3",
]
# https://pypi.org/classifiers/
classifiers = [
    "Development Status :: 5 - Production/Stable",
    # "Development Status :: 6 - Mature",
    # "Development Status :: 7 - Inactive",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.15",
]

[dependency-groups]
dev = [
    "flake8",
    "freezegun",
    "munch",
    "munch-stubs",
    "mypy",
    "panda-pytest-assertions",
    "pydoclint",
    "pytest",
    "pytest-cov",
    "pytest-loguru",
    "pytest-mock",
    "ruff",
]

[project.urls]
homepage = "https://github.com/KRunchPL/panda-simple-releases"
repository = "https://github.com/KRunchPL/panda-simple-releases"
documentation = "https://github.com/KRunchPL/panda-simple-releases"

[project.scripts]
panda-simple-releases = "panda_simple_releases._app.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/panda_simple_releases"]

[tool.hatch.version]
scheme = "semver"
path = "version.txt"
pattern = "(?P<version>.*)"

[build-system]
requires = ["hatchling", "hatch-semver"]
build-backend = "hatchling.build"

[tool.uv]
system-certs = true
add-bounds = "exact"
